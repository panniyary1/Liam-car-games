name: Create Android Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Create signing keystore
        run: |
          keytool -genkeypair \
            -keystore liam-car-games.jks \
            -alias liamcar \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "LiamCarGames2026!" \
            -keypass "LiamCarGames2026!" \
            -dname "CN=Liam Car Games, OU=Games, O=Liam Car Games, L=Miami, ST=Florida, C=US"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: liam-car-games-keystore
          path: liam-car-games.jks
