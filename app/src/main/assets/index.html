<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Liam Car Games</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#79d6ff;touch-action:none}
button{font-family:inherit;font-weight:900}
.screen{position:fixed;inset:0;display:none}
.screen.show{display:block}
#home{background:linear-gradient(#6ed1ff 0 54%,#63c95a 54%);text-align:center;color:#fff}
.logo{margin-top:5vh;font-size:clamp(30px,7vw,60px);font-weight:900;text-shadow:0 4px 0 #1455a0,0 8px 14px #0004}
.sub{font-size:18px;margin:8px 0 12px;text-shadow:0 2px 3px #0005}
#driverIcon{font-size:66px;margin:8px}
.big{display:block;width:min(330px,80vw);margin:12px auto;padding:15px;border:0;border-radius:22px;font-size:23px;box-shadow:0 7px 0 #0003}
.play{background:#ffd43b;color:#3c2a00}
.garageBtn{background:#1da8f2;color:#fff}
.driverBtn{background:#ff7398;color:#fff}
#garage,#driver{background:linear-gradient(#e8f8ff,#8dd7ff);padding:14px;text-align:center;overflow:auto}
.panel{background:#fff;border-radius:26px;padding:18px;max-width:780px;margin:14px auto;box-shadow:0 10px 28px #0002}
.back{position:fixed;top:12px;left:12px;border:0;border-radius:14px;padding:10px 14px;font-size:21px;z-index:40}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:560px;margin:0 auto}
.carChoice{position:relative;min-height:126px;border:5px solid transparent;border-radius:20px;background:linear-gradient(#fafdff,#e8f5ff);box-shadow:0 5px 14px #0002;padding:8px}
.carChoice.sel{border-color:#ffd43b;transform:translateY(-2px)}
.carChoice canvas{width:100%;height:90px;display:block}
.carChoice span{display:block;font-size:13px;color:#234;margin-top:3px}
.driverChoice{display:inline-flex;align-items:center;justify-content:center;width:88px;height:88px;margin:7px;border:5px solid transparent;border-radius:22px;background:#eef7ff;font-size:50px}
.driverChoice.sel{border-color:#ffd43b}
#game{background:#63ba4d}
#gameCanvas{width:100%;height:100%;display:block}
#hud{position:fixed;top:10px;left:12px;color:#fff;font-size:18px;font-weight:900;text-shadow:0 2px 5px #000;z-index:14}
#lives{position:fixed;top:10px;left:50%;transform:translateX(-50%);font-size:20px;font-weight:900;z-index:14;text-shadow:0 2px 4px #000}
#homeBtn,#soundBtn{position:fixed;right:12px;border:0;border-radius:12px;padding:9px 12px;z-index:15}
#homeBtn{top:10px}
#soundBtn{top:52px;font-size:18px}
.ctrl{position:fixed;bottom:22px;width:80px;height:80px;border-radius:50%;border:4px solid #fff;background:#126bd0d9;color:#fff;font-size:37px;z-index:16;box-shadow:0 5px 12px #0004}
#left{left:22px} #right{right:22px}
#cheer,#crashMsg,#gameOver{position:fixed;left:50%;transform:translate(-50%,-50%);z-index:50;text-align:center;font-weight:900;border:4px solid #fff;box-shadow:0 8px 22px #0005;display:none}
#cheer{top:18%;width:min(230px,50vw);padding:7px 10px;border-radius:15px;background:linear-gradient(135deg,#fff7a8,#ffd43b,#ffb44b);color:#6a4300;font-size:clamp(14px,3vw,20px)}
#cheer small,#crashMsg small{display:block;font-size:11px;margin-top:2px}
#crashMsg{top:42%;background:#ff9f1c;color:#5b2d00;padding:12px 18px;border-radius:18px;font-size:clamp(20px,5vw,34px)}
#gameOver{top:45%;background:#fff;color:#222;padding:20px;border-radius:24px;width:min(350px,84vw)}
#gameOver h2{margin:0 0 7px;font-size:30px}
#restartBtn{border:0;border-radius:16px;padding:13px 20px;font-size:20px;background:#ffd43b;font-weight:900}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>

<section id="home" class="screen show">
  <div class="logo">🏁 LIAM CAR GAMES 🏁</div>
  <div class="sub">Drive • Dodge • Collect • Have Fun!</div>
  <div id="driverIcon">🧒</div>
  <button class="big play" id="playHome">▶ PLAY</button>
  <button class="big garageBtn" id="garageHome">🚗 MY GARAGE</button>
  <button class="big driverBtn" id="driverHome">🙂 MY DRIVER</button>
</section>

<section id="garage" class="screen">
  <button class="back" data-back>←</button>
  <div class="panel">
    <h2>Choose Your Car</h2>
    <div class="grid" id="carGrid"></div>
    <button class="big play" id="playGarage">▶ PLAY</button>
  </div>
</section>

<section id="driver" class="screen">
  <button class="back" data-back>←</button>
  <div class="panel">
    <h2>Choose Your Driver</h2>
    <div class="driverChoice sel" data-driver="🧒">🧒</div>
    <div class="driverChoice" data-driver="👦">👦</div>
    <div class="driverChoice" data-driver="👧">👧</div>
    <div class="driverChoice" data-driver="🧑">🧑</div>
    <button class="big play" data-back>✓ DONE</button>
  </div>
</section>

<section id="game" class="screen">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">🪙 <span id="coins">0</span> &nbsp; 🚗 <span id="passed">0</span></div>
  <div id="lives">❤️❤️❤️</div>
  <button id="homeBtn">HOME</button>
  <button id="soundBtn">🔊</button>
  <button id="left" class="ctrl">◀</button>
  <button id="right" class="ctrl">▶</button>
</section>

<div id="cheer">🎊 GREAT JOB! 🎊<small>Keep going!</small></div>
<div id="crashMsg">💥 CRASH!<small>Be careful!</small></div>
<div id="gameOver">
  <h2>🏁 GAME OVER</h2>
  <div>You used all 3 crashes.</div>
  <p>Try again!</p>
  <button id="restartBtn">🔄 PLAY AGAIN</button>
</div>

<script>
(function(){
'use strict';

const $=id=>document.getElementById(id);
const canvas=$('gameCanvas'),ctx=canvas.getContext('2d');
const screens=document.querySelectorAll('.screen');

const cars=[
 {id:'sport',name:'SPORT',color:'#ef233c',accent:'#111827',type:'sport'},
 {id:'suv',name:'SUV',color:'#2563eb',accent:'#dbeafe',type:'suv'},
 {id:'truck',name:'TRUCK',color:'#16a34a',accent:'#6b7280',type:'truck'},
 {id:'police',name:'POLICE',color:'#f8fafc',accent:'#1f2937',type:'police'},
 {id:'taxi',name:'TAXI',color:'#facc15',accent:'#111827',type:'taxi'},
 {id:'fire',name:'FIRE TRUCK',color:'#dc2626',accent:'#fde047',type:'fire'},
 {id:'ambulance',name:'AMBULANCE',color:'#ffffff',accent:'#ef4444',type:'ambulance'},
 {id:'van',name:'VAN',color:'#8b5cf6',accent:'#c4b5fd',type:'van'},
 {id:'cyan',name:'CITY CAR',color:'#06b6d4',accent:'#cffafe',type:'car'},
 {id:'racer',name:'RACER',color:'#111827',accent:'#facc15',type:'sport'}
];

let selectedCar=cars[0],selectedDriver='🧒';
let W=0,H=0,playing=false,paused=false,frame=0;
let playerX=0,playerY=0,leftHeld=false,rightHeld=false;
let coins=0,passed=0,lives=3,invincible=false;
let traffic=[],coinList=[],particles=[];
let soundOn=true,audioCtx=null,musicTimer=null,musicStep=0;
const animals=['🐄','🐎','🐑','🐕','🦌','🐖','🐐','🦙'];

function show(id){
  screens.forEach(s=>s.classList.remove('show'));
  $(id).classList.add('show');
  playing=id==='game';
  if(!playing){
    stopMusic(); paused=false; invincible=false;
    $('crashMsg').style.display='none'; $('gameOver').style.display='none';
  }
}
function resize(){
  W=canvas.width=innerWidth; H=canvas.height=innerHeight;
  playerY=H-120; if(!playerX)playerX=W/2;
}
addEventListener('resize',resize); resize();

function roadWidth(y){return 150+(W*.72-150)*(Math.max(0,Math.min(H,y))/H)}
function roadLeft(y){return W/2-roadWidth(y)/2}

function roundRect(c,x,y,w,h,r){
  c.beginPath(); c.roundRect(x,y,w,h,r); c.fill();
}
function drawVehicle(c,x,y,scale,car,heading){
  c.save();
  c.translate(x,y);
  if(heading==='down')c.rotate(Math.PI);
  c.scale(scale,scale);

  c.fillStyle='rgba(0,0,0,.24)';
  c.beginPath(); c.ellipse(0,7,31,48,0,0,Math.PI*2); c.fill();

  const type=car.type,color=car.color,accent=car.accent;
  c.fillStyle='#101214';
  if(type==='suv'||type==='fire'||type==='ambulance'||type==='van'){
    c.fillRect(-30,-31,8,22);c.fillRect(22,-31,8,22);c.fillRect(-30,16,8,22);c.fillRect(22,16,8,22);
  }else{
    c.fillRect(-27,-30,7,20);c.fillRect(20,-30,7,20);c.fillRect(-27,16,7,20);c.fillRect(20,16,7,20);
  }

  if(type==='sport'){
    c.fillStyle=color;
    c.beginPath();
    c.moveTo(0,-52);c.lineTo(20,-38);c.lineTo(24,25);c.lineTo(14,45);c.lineTo(-14,45);c.lineTo(-24,25);c.lineTo(-20,-38);c.closePath();c.fill();
    c.fillStyle=accent;c.fillRect(-4,-45,8,84);
  }else if(type==='truck'){
    c.fillStyle=color;roundRect(c,-24,-49,48,55,10);
    c.strokeStyle=color;c.lineWidth=6;c.strokeRect(-21,10,42,34);
    c.fillStyle='#5e646d';c.fillRect(-17,14,34,26);
  }else{
    c.fillStyle=color;
    const ww=(type==='suv'||type==='fire'||type==='ambulance'||type==='van')?52:46;
    roundRect(c,-ww/2,-50,ww,100,(type==='fire'||type==='ambulance')?8:12);
  }

  c.fillStyle='#9ee7ff';
  if(type==='truck'){
    roundRect(c,-16,-30,32,18,5);
  }else{
    roundRect(c,-16,-29,32,19,5);
    if(type!=='fire'&&type!=='ambulance')roundRect(c,-16,11,32,18,5);
  }

  c.fillStyle='#fff7b2';c.fillRect(-15,-46,9,5);c.fillRect(6,-46,9,5);
  c.fillStyle='#ff5c5c';c.fillRect(-15,39,9,5);c.fillRect(6,39,9,5);

  if(type==='police'){
    c.fillStyle='#1f2937';c.fillRect(-23,5,46,17);
    c.fillStyle='#ef4444';c.fillRect(-13,-6,12,7);
    c.fillStyle='#2563eb';c.fillRect(1,-6,12,7);
  }
  if(type==='taxi'){
    c.fillStyle='#111';c.fillRect(-23,2,46,7);
    c.fillStyle='#fff';c.font='10px Arial';c.textAlign='center';c.fillText('TAXI',0,-1);
  }
  if(type==='fire'){
    c.fillStyle=accent;c.fillRect(-21,-5,42,7);
    c.fillStyle='#d1d5db';c.fillRect(-4,6,8,35);
    for(let yy=8;yy<39;yy+=8)c.fillRect(-11,yy,22,3);
  }
  if(type==='ambulance'){
    c.fillStyle=accent;c.fillRect(-4,-5,8,29);c.fillRect(-14,6,28,8);c.fillRect(-26,30,52,7);
  }
  if(type==='van'){
    c.fillStyle=accent;c.fillRect(-17,-5,34,13);c.fillRect(-17,15,34,13);
  }
  if(type==='suv'){
    c.fillStyle=accent;c.fillRect(-18,-3,36,7);
  }
  c.restore();
}

function buildGarage(){
  const grid=$('carGrid');grid.innerHTML='';
  cars.forEach((car,i)=>{
    const d=document.createElement('div');d.className='carChoice'+(i===0?' sel':'');
    d.dataset.id=car.id;
    const cv=document.createElement('canvas');cv.width=150;cv.height=100;
    const label=document.createElement('span');label.textContent=car.name;
    d.appendChild(cv);d.appendChild(label);grid.appendChild(d);
    drawVehicle(cv.getContext('2d'),75,50,.72,car,'up');
    d.addEventListener('click',()=>{
      document.querySelectorAll('.carChoice').forEach(x=>x.classList.remove('sel'));
      d.classList.add('sel');selectedCar=car;
    });
  });
}
buildGarage();

function startGame(){
  coins=0;passed=0;lives=3;frame=0;traffic=[];coinList=[];particles=[];
  paused=false;invincible=false;playerX=W/2;playerY=H-120;
  $('coins').textContent='0';$('passed').textContent='0';updateLives();
  $('gameOver').style.display='none';show('game');startMusic();
}
function updateLives(){
  $('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);
}

function drawBackground(){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#68cfff');sky.addColorStop(.5,'#d8f5ff');sky.addColorStop(.51,'#68c75a');sky.addColorStop(1,'#3f9f35');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#fff';
  for(let i=0;i<5;i++){
    const x=(i*260+90-frame*.08)%(W+320)-130,y=65+(i%2)*36;
    ctx.beginPath();ctx.arc(x,y,24,0,Math.PI*2);ctx.arc(x+29,y-5,31,0,Math.PI*2);ctx.arc(x+58,y+2,23,0,Math.PI*2);ctx.fill();
  }

  ctx.fillStyle='#3d8e35';ctx.beginPath();
  ctx.moveTo(0,H*.50);ctx.lineTo(W*.14,H*.34);ctx.lineTo(W*.29,H*.50);ctx.lineTo(W*.45,H*.29);ctx.lineTo(W*.61,H*.50);ctx.lineTo(W*.79,H*.35);ctx.lineTo(W,H*.50);ctx.closePath();ctx.fill();
}

function drawRoad(){
  ctx.fillStyle='#c9b88d';ctx.beginPath();
  ctx.moveTo(W/2-90,0);ctx.lineTo(W/2+90,0);ctx.lineTo(W/2+W*.40,H);ctx.lineTo(W/2-W*.40,H);ctx.closePath();ctx.fill();

  const asphalt=ctx.createLinearGradient(0,0,0,H);asphalt.addColorStop(0,'#55585d');asphalt.addColorStop(1,'#2e3034');
  ctx.fillStyle=asphalt;ctx.beginPath();
  ctx.moveTo(W/2-75,0);ctx.lineTo(W/2+75,0);ctx.lineTo(W/2+W*.37,H);ctx.lineTo(W/2-W*.37,H);ctx.closePath();ctx.fill();

  ctx.strokeStyle='#fff';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(W/2-75,0);ctx.lineTo(W/2-W*.37,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2+75,0);ctx.lineTo(W/2+W*.37,H);ctx.stroke();

  ctx.strokeStyle='#ffd43b';ctx.lineWidth=5;
  for(let y=(frame*6)%160-160;y<H;y+=160){
    const seg=55+(y/H)*25;ctx.beginPath();ctx.moveTo(W/2,y);ctx.lineTo(W/2,y+seg);ctx.stroke();
  }
}
function drawScenery(){
  for(let i=0;i<11;i++){
    const y=((frame*2+i*120)%(H+160))-80,left=roadLeft(y),rw=roadWidth(y),side=i%2?-1:1;
    const x=side<0?left-60-(i%3)*25:left+rw+60+(i%3)*25,sc=.55+(y/H)*.72;
    ctx.font=(42*sc)+'px Arial';ctx.textAlign='center';ctx.fillText(i%4===0?'🌴':'🌳',x,y);
  }
  for(let i=0;i<8;i++){
    const y=((frame*1.55+i*185)%(H+190))-95,left=roadLeft(y),rw=roadWidth(y),side=i%2?-1:1;
    const x=side<0?left-110:left+rw+110,sc=.52+(y/H)*.60;
    ctx.font=(31*sc)+'px Arial';ctx.fillText(animals[i%animals.length],x,y);
  }
  for(let i=0;i<12;i++){
    const y=((frame*1.35+i*100)%(H+120))-60,left=roadLeft(y),rw=roadWidth(y),side=i%2?-1:1;
    const x=side<0?left-32-(i%3)*20:left+rw+32+(i%3)*20;
    ctx.font='16px Arial';ctx.fillText(i%3?'🌼':'🌸',x,y);
  }
}

function spawnTraffic(){
  if(frame%120===0){
    let offset;
    do{offset=(Math.random()-.5)*.44}while(traffic.some(t=>Math.abs(t.offset-offset)<.15&&t.y<180));
    const car=cars[Math.floor(Math.random()*cars.length)];
    traffic.push({offset,y:-90,speed:2.25+Math.random()*.65,car});
  }
}
function spawnCoin(){
  if(frame%105===0)coinList.push({offset:(Math.random()-.5)*.40,y:-40,speed:3.4});
}
function vehicleX(t){return W/2+t.offset*roadWidth(t.y)}
function collision(t){
  if(invincible||paused)return false;
  const x=vehicleX(t);
  const dx=Math.abs(x-playerX),dy=Math.abs(t.y-playerY);
  return dx<39&&dy<72;
}
function handleCrash(){
  if(invincible||paused)return;
  lives--;updateLives();crashSound();stopMusic();
  paused=true;invincible=true;
  burst(playerX,playerY);
  $('crashMsg').style.display='block';

  setTimeout(()=>{
    $('crashMsg').style.display='none';
    if(lives<=0){
      playing=false;paused=true;$('gameOver').style.display='block';return;
    }
    traffic=[];coinList=[];playerX=W/2;playerY=H-120;
    paused=false;startMusic();
    setTimeout(()=>invincible=false,1400);
  },1000);
}
function updateTraffic(){
  for(let i=traffic.length-1;i>=0;i--){
    const t=traffic[i];t.y+=t.speed;
    const x=vehicleX(t),sc=.62+(t.y/H)*.34;
    drawVehicle(ctx,x,t.y,sc,t.car,'down');
    if(collision(t)){traffic.splice(i,1);handleCrash();continue}
    if(t.y>H+100){
      traffic.splice(i,1);passed++;$('passed').textContent=passed;
      if(passed%15===0)showCheer();
    }
  }
}
function updateCoins(){
  for(let i=coinList.length-1;i>=0;i--){
    const c=coinList[i];c.y+=c.speed;
    const x=W/2+c.offset*roadWidth(c.y);
    ctx.font='30px Arial';ctx.textAlign='center';ctx.fillText('🪙',x,c.y);
    if(Math.abs(x-playerX)<38&&Math.abs(c.y-playerY)<55){
      coinList.splice(i,1);coins++;$('coins').textContent=coins;coinSound();continue;
    }
    if(c.y>H+55)coinList.splice(i,1);
  }
}
function movePlayer(){
  if(leftHeld)playerX-=6;if(rightHeld)playerX+=6;
  const l=roadLeft(playerY),rw=roadWidth(playerY);
  playerX=Math.max(l+38,Math.min(l+rw-38,playerX));
}
function drawPlayer(){
  drawVehicle(ctx,playerX,playerY,1.02,selectedCar,'up');
  ctx.font='21px Arial';ctx.textAlign='center';ctx.fillText(selectedDriver,playerX,playerY-67);
}
function burst(x,y){
  for(let i=0;i<18;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7-2,life:30+Math.random()*15});
}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.16;p.life--;
    ctx.fillStyle=i%2?'#ffd43b':'#ff5d5d';ctx.fillRect(p.x,p.y,5,5);
    if(p.life<=0)particles.splice(i,1);
  }
}
function loop(){
  requestAnimationFrame(loop);
  if(!playing)return;
  drawBackground();drawRoad();drawScenery();
  if(!paused){
    frame++;spawnTraffic();spawnCoin();updateTraffic();updateCoins();movePlayer();
  }else{
    updateTrafficFrozen();
  }
  drawPlayer();updateParticles();
}
function updateTrafficFrozen(){
  traffic.forEach(t=>{
    const x=vehicleX(t),sc=.62+(t.y/H)*.34;
    drawVehicle(ctx,x,t.y,sc,t.car,'down');
  });
  coinList.forEach(c=>{
    const x=W/2+c.offset*roadWidth(c.y);
    ctx.font='30px Arial';ctx.textAlign='center';ctx.fillText('🪙',x,c.y);
  });
}
loop();

function showCheer(){
  $('cheer').style.display='block';cheerSound();
  setTimeout(()=>$('cheer').style.display='none',1050);
}
function ensureAudio(){
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
}
function tone(freq,dur,vol,type='triangle'){
  if(!soundOn)return;
  ensureAudio();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
}
function coinSound(){tone(988,.06,.035);setTimeout(()=>tone(1480,.08,.03),65)}
function crashSound(){
  tone(140,.10,.075,'sawtooth');
  setTimeout(()=>tone(95,.16,.065,'square'),65);
  setTimeout(()=>tone(65,.22,.05,'sawtooth'),140);
}
function cheerSound(){
  [659,784,988,1175].forEach((n,i)=>setTimeout(()=>tone(n,.11,.035),i*95));
}
function startMusic(){
  stopMusic();if(!soundOn)return;musicStep=0;
  const melody=[523,659,784,659,587,698,880,698,659,784,988,784,587,659,784,523];
  const bass=[131,147,165,147];
  musicTimer=setInterval(()=>{
    if(!playing||paused||!soundOn)return;
    const i=musicStep++;
    tone(melody[i%melody.length],.10,.012,'triangle');
    if(i%2===0)tone(bass[Math.floor(i/4)%bass.length],.07,.006,'square');
    if(i%4===2)setTimeout(()=>tone(1047,.035,.004,'sine'),80);
  },390);
}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}

$('playHome').addEventListener('click',startGame);
$('playGarage').addEventListener('click',startGame);
$('garageHome').addEventListener('click',()=>show('garage'));
$('driverHome').addEventListener('click',()=>show('driver'));
$('homeBtn').addEventListener('click',()=>show('home'));
$('restartBtn').addEventListener('click',()=>{ $('gameOver').style.display='none';startGame();});
document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>show('home')));

document.querySelectorAll('.driverChoice').forEach(el=>{
  el.addEventListener('click',()=>{
    document.querySelectorAll('.driverChoice').forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel');selectedDriver=el.dataset.driver;$('driverIcon').textContent=selectedDriver;
  });
});

$('soundBtn').addEventListener('click',()=>{
  soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊':'🔇';
  if(soundOn&&playing&&!paused)startMusic();else stopMusic();
});
function hold(btn,side){
  const on=e=>{e.preventDefault();if(side==='L')leftHeld=true;else rightHeld=true};
  const off=e=>{e.preventDefault();if(side==='L')leftHeld=false;else rightHeld=false};
  btn.addEventListener('touchstart',on,{passive:false});btn.addEventListener('touchend',off,{passive:false});btn.addEventListener('touchcancel',off,{passive:false});
  btn.addEventListener('mousedown',on);btn.addEventListener('mouseup',off);btn.addEventListener('mouseleave',off);
}
hold($('left'),'L');hold($('right'),'R');
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')leftHeld=true;if(e.key==='ArrowRight')rightHeld=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')leftHeld=false;if(e.key==='ArrowRight')rightHeld=false});

})();
</script>
