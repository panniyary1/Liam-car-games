<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Liam Car Games</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d18;font-family:Arial,sans-serif;touch-action:none}
button{font-family:inherit;font-weight:900}
.screen{position:fixed;inset:0;display:none}
.screen.show{display:block}
#home{background:
radial-gradient(circle at 50% 36%,#163c73 0,#0c1f3d 34%,#07101d 70%);color:#fff;text-align:center;overflow:hidden}
.homeGlow{position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,#00a6ff18 50%,transparent 60%);animation:glow 4s linear infinite}
@keyframes glow{from{transform:translateX(-70%)}to{transform:translateX(70%)}}
.logo{position:relative;margin-top:6vh;font-size:clamp(34px,8vw,68px);font-weight:1000;letter-spacing:1px;
color:#ffb703;text-shadow:0 3px 0 #8a3300,0 7px 18px #000,0 0 18px #ff9f1c}
.logo small{display:block;color:#fff;font-size:.38em;letter-spacing:4px;text-shadow:0 2px 5px #000}
.heroCar{font-size:clamp(80px,18vw,150px);filter:drop-shadow(0 18px 12px #0009);transform:rotate(-4deg);margin:2vh 0}
.big{display:block;width:min(350px,82vw);margin:11px auto;padding:14px;border:0;border-radius:18px;font-size:22px;box-shadow:0 7px 0 #0007}
.play{background:linear-gradient(#70e000,#34a800);color:#fff;border:2px solid #a6ff6a}
.garageBtn{background:linear-gradient(#1982ff,#0759be);color:#fff;border:2px solid #65b7ff}
.driverBtn{background:linear-gradient(#ff4f94,#b61d63);color:#fff;border:2px solid #ff9dc6}
#garage,#driver{background:radial-gradient(circle at 50% 10%,#123864,#08111e 72%);padding:14px;text-align:center;color:#fff;overflow:auto}
.panel{background:linear-gradient(180deg,#14233a,#0b1524);border:1px solid #3a5574;border-radius:24px;padding:18px;max-width:860px;margin:14px auto;box-shadow:0 15px 36px #0009}
.back{position:fixed;top:12px;left:12px;border:0;border-radius:14px;padding:10px 14px;font-size:20px;z-index:40;background:#15263f;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:620px;margin:0 auto}
.carChoice{position:relative;min-height:138px;border:4px solid #263b57;border-radius:18px;background:linear-gradient(#152944,#09121f);padding:8px;box-shadow:inset 0 0 25px #0006}
.carChoice.sel{border-color:#ffd43b;box-shadow:0 0 20px #ffca3a88,inset 0 0 25px #0006;transform:translateY(-2px)}
.carChoice canvas{width:100%;height:100px;display:block}
.carChoice span{display:block;font-size:13px;color:#d9ecff;margin-top:3px}
.driverChoice{display:inline-flex;align-items:center;justify-content:center;width:92px;height:92px;margin:7px;border:4px solid #29415f;border-radius:22px;background:#102239;font-size:50px}
.driverChoice.sel{border-color:#ffd43b;box-shadow:0 0 18px #ffd43b66}
#game{background:#111}
#gameCanvas{width:100%;height:100%;display:block}
#hud{position:fixed;top:9px;left:10px;color:#fff;font-size:18px;font-weight:900;text-shadow:0 2px 5px #000;z-index:14;background:#07111dcc;border:1px solid #5d7897;border-radius:13px;padding:7px 10px}
#lives{position:fixed;top:9px;left:50%;transform:translateX(-50%);font-size:20px;font-weight:900;z-index:14;background:#07111dcc;border:1px solid #5d7897;border-radius:13px;padding:6px 11px}
#speedHud{position:fixed;top:9px;right:10px;color:#fff;font-weight:900;z-index:14;background:#07111dcc;border:1px solid #5d7897;border-radius:13px;padding:6px 10px;text-align:right}
#speedHud b{color:#ffd43b;font-size:21px}
#homeBtn,#soundBtn{position:fixed;right:12px;border:0;border-radius:12px;padding:8px 11px;z-index:15;background:#0d1d30dd;color:#fff;border:1px solid #5c7898}
#homeBtn{top:70px} #soundBtn{top:111px;font-size:18px}
.ctrl{position:fixed;bottom:22px;width:82px;height:82px;border-radius:50%;border:3px solid #e8f5ff;background:#101821cc;color:#fff;font-size:37px;z-index:16;box-shadow:0 5px 14px #0008,inset 0 0 18px #68b8ff33}
#left{left:22px} #right{right:22px}
#nitro{position:fixed;right:26px;bottom:120px;width:65px;height:65px;border-radius:50%;border:3px solid #78d8ff;background:radial-gradient(circle,#1e9cff,#004f9d);color:#fff;font-size:27px;z-index:17;box-shadow:0 0 18px #00a6ff99}
#cheer,#crashMsg,#gameOver{position:fixed;left:50%;transform:translate(-50%,-50%);z-index:50;text-align:center;font-weight:900;border:3px solid #fff;box-shadow:0 9px 26px #0008;display:none}
#cheer{top:18%;background:linear-gradient(135deg,#fff3a0,#ffc300);color:#573300;padding:8px 13px;border-radius:15px;font-size:clamp(15px,3vw,21px)}
#crashMsg{top:42%;background:linear-gradient(#ff9f1c,#ff5f00);color:#fff;padding:13px 19px;border-radius:18px;font-size:clamp(20px,5vw,34px)}
#gameOver{top:45%;background:linear-gradient(#16273f,#09111d);color:#fff;padding:22px;border-radius:24px;width:min(360px,84vw)}
#restartBtn{border:0;border-radius:15px;padding:13px 20px;font-size:20px;background:#62d516;color:#fff}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>

<section id="home" class="screen show">
  <div class="homeGlow"></div>
  <div class="logo">LIAM<small>CAR GAMES</small></div>
  <div class="heroCar">🏎️</div>
  <button class="big play" id="playHome">▶ PLAY</button>
  <button class="big garageBtn" id="garageHome">🚘 GARAGE</button>
  <button class="big driverBtn" id="driverHome">🙂 DRIVER</button>
</section>

<section id="garage" class="screen">
  <button class="back" data-back>←</button>
  <div class="panel">
    <h2>GARAGE</h2>
    <div class="grid" id="carGrid"></div>
    <button class="big play" id="playGarage">▶ PLAY</button>
  </div>
</section>

<section id="driver" class="screen">
  <button class="back" data-back>←</button>
  <div class="panel">
    <h2>CHOOSE DRIVER</h2>
    <div class="driverChoice sel" data-driver="🧒">🧒</div>
    <div class="driverChoice" data-driver="👦">👦</div>
    <div class="driverChoice" data-driver="👧">👧</div>
    <div class="driverChoice" data-driver="🧑">🧑</div>
    <button class="big play" data-back>✓ DONE</button>
  </div>
</section>

<section id="game" class="screen">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">🪙 <span id="coins">0</span> &nbsp; 🏆 <span id="score">0</span></div>
  <div id="lives">❤️❤️❤️</div>
  <div id="speedHud"><b id="speedTxt">120</b><br><small>KM/H</small></div>
  <button id="homeBtn">HOME</button>
  <button id="soundBtn">🔊</button>
  <button id="left" class="ctrl">◀</button>
  <button id="right" class="ctrl">▶</button>
  <button id="nitro">⚡</button>
</section>

<div id="cheer">🎊 GREAT JOB! 🎊</div>
<div id="crashMsg">💥 CRASH!</div>
<div id="gameOver"><h2>🏁 GAME OVER</h2><p>Try again!</p><button id="restartBtn">🔄 PLAY AGAIN</button></div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id), canvas=$('gameCanvas'),ctx=canvas.getContext('2d');
const screens=document.querySelectorAll('.screen');

const cars=[
{id:'viper',name:'VIPER',color:'#e51b23',accent:'#1b1b1b',type:'sport'},
{id:'thunder',name:'THUNDER',color:'#0d6efd',accent:'#b9e0ff',type:'sport'},
{id:'beast',name:'BEAST',color:'#111827',accent:'#ffcc00',type:'muscle'},
{id:'phantom',name:'PHANTOM',color:'#f8fafc',accent:'#1f2937',type:'luxury'},
{id:'ranger',name:'RANGER',color:'#16a34a',accent:'#64748b',type:'truck'},
{id:'police',name:'POLICE',color:'#f8fafc',accent:'#0f172a',type:'police'},
{id:'taxi',name:'TAXI',color:'#facc15',accent:'#111827',type:'taxi'},
{id:'fire',name:'FIRE',color:'#dc2626',accent:'#fde047',type:'fire'},
{id:'medic',name:'MEDIC',color:'#ffffff',accent:'#ef4444',type:'ambulance'}
];

let selectedCar=cars[1],selectedDriver='🧒';
let W=0,H=0,playing=false,paused=false,frame=0;
let playerX=0,playerY=0,leftHeld=false,rightHeld=false,nitroHeld=false;
let coins=0,score=0,lives=3,invincible=false,speed=5.2;
let traffic=[],coinList=[],particles=[],roadOffset=0;
let soundOn=true,audioCtx=null,musicTimer=null,musicStep=0;

function show(id){
 screens.forEach(s=>s.classList.remove('show')); $(id).classList.add('show');
 playing=id==='game';
 if(!playing){stopMusic();paused=false;invincible=false;$('crashMsg').style.display='none';$('gameOver').style.display='none';}
}
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;playerY=H-125;if(!playerX)playerX=W/2}
addEventListener('resize',resize);resize();

function roadWidth(y){const p=Math.max(0,Math.min(1,y/H));return 105+(W*.78-105)*Math.pow(p,1.18)}
function roadLeft(y){return W/2-roadWidth(y)/2}

function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function vehicle(c,x,y,scale,car,down=false){
 c.save();c.translate(x,y);if(down)c.rotate(Math.PI);c.scale(scale,scale);
 c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(0,13,34,50,0,0,Math.PI*2);c.fill();
 const type=car.type,color=car.color,accent=car.accent;
 c.fillStyle='#090b0e';
 const wide=type==='truck'||type==='fire'||type==='ambulance';
 let wx=wide?31:28;
 c.fillRect(-wx,-29,8,22);c.fillRect(wx-8,-29,8,22);c.fillRect(-wx,16,8,22);c.fillRect(wx-8,16,8,22);

 if(type==='sport'){
   c.fillStyle=color;c.beginPath();c.moveTo(0,-54);c.lineTo(20,-39);c.lineTo(25,24);c.lineTo(15,47);c.lineTo(-15,47);c.lineTo(-25,24);c.lineTo(-20,-39);c.closePath();c.fill();
 }else if(type==='muscle'){
   c.fillStyle=color;rr(c,-25,-50,50,99,9);c.fillStyle=accent;c.fillRect(-4,-47,8,91);
 }else if(type==='truck'){
   c.fillStyle=color;rr(c,-26,-50,52,58,10);c.strokeStyle=color;c.lineWidth=6;c.strokeRect(-22,12,44,33);c.fillStyle='#555d68';c.fillRect(-18,16,36,25);
 }else{
   c.fillStyle=color;rr(c,-26,-51,52,101,type==='fire'||type==='ambulance'?7:11);
 }

 c.fillStyle='#9adfff';rr(c,-16,-31,32,18,4);
 if(type!=='truck'&&type!=='fire'&&type!=='ambulance'){c.fillStyle='#7ec7ec';rr(c,-15,10,30,18,4)}
 c.fillStyle='#fef3a5';c.fillRect(-16,-47,10,5);c.fillRect(6,-47,10,5);
 c.fillStyle='#ff3131';c.fillRect(-16,41,10,5);c.fillRect(6,41,10,5);

 if(type==='police'){c.fillStyle='#111827';c.fillRect(-26,3,52,17);c.fillStyle='#e11d48';c.fillRect(-13,-7,12,7);c.fillStyle='#2563eb';c.fillRect(1,-7,12,7)}
 if(type==='taxi'){c.fillStyle='#111';c.fillRect(-25,2,50,6)}
 if(type==='fire'){c.fillStyle=accent;c.fillRect(-21,-3,42,7);c.fillStyle='#d1d5db';c.fillRect(-4,7,8,35)}
 if(type==='ambulance'){c.fillStyle=accent;c.fillRect(-4,-5,8,30);c.fillRect(-14,7,28,8)}
 // glossy highlight
 const g=c.createLinearGradient(-25,-50,22,40);g.addColorStop(0,'rgba(255,255,255,.44)');g.addColorStop(.25,'rgba(255,255,255,.08)');g.addColorStop(.7,'rgba(255,255,255,0)');
 c.fillStyle=g;rr(c,-18,-43,12,70,8);
 c.restore();
}

function buildGarage(){
 const grid=$('carGrid');grid.innerHTML='';
 cars.forEach((car,i)=>{
   const d=document.createElement('div');d.className='carChoice'+(car.id===selectedCar.id?' sel':'');d.dataset.id=car.id;
   const cv=document.createElement('canvas');cv.width=170;cv.height=105;
   const label=document.createElement('span');label.textContent=car.name;
   d.append(cv,label);grid.appendChild(d);vehicle(cv.getContext('2d'),85,53,.77,car,false);
   d.onclick=()=>{document.querySelectorAll('.carChoice').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');selectedCar=car};
 });
}
buildGarage();

function startGame(){
 coins=0;score=0;lives=3;frame=0;traffic=[];coinList=[];particles=[];paused=false;invincible=false;speed=5.2;
 playerX=W/2;playerY=H-125;$('coins').textContent='0';$('score').textContent='0';updateLives();$('gameOver').style.display='none';show('game');startMusic();
}
function updateLives(){$('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}

function background(){
 // sky
 let sky=ctx.createLinearGradient(0,0,0,H*.58);sky.addColorStop(0,'#1f8be8');sky.addColorStop(.53,'#83d2ff');sky.addColorStop(1,'#c8efff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // sun
 const sun=ctx.createRadialGradient(W*.78,H*.14,3,W*.78,H*.14,90);sun.addColorStop(0,'#fff');sun.addColorStop(.2,'#fff6b7');sun.addColorStop(1,'rgba(255,232,120,0)');ctx.fillStyle=sun;ctx.fillRect(0,0,W,H*.45);
 // distant mountains
 ctx.fillStyle='#557d8d';ctx.beginPath();ctx.moveTo(0,H*.48);ctx.lineTo(W*.14,H*.30);ctx.lineTo(W*.28,H*.47);ctx.lineTo(W*.44,H*.24);ctx.lineTo(W*.59,H*.47);ctx.lineTo(W*.76,H*.31);ctx.lineTo(W,H*.48);ctx.lineTo(W,H*.62);ctx.lineTo(0,H*.62);ctx.fill();
 ctx.fillStyle='#315b55';ctx.beginPath();ctx.moveTo(0,H*.54);ctx.lineTo(W*.15,H*.39);ctx.lineTo(W*.31,H*.54);ctx.lineTo(W*.53,H*.34);ctx.lineTo(W*.70,H*.54);ctx.lineTo(W*.86,H*.41);ctx.lineTo(W,H*.54);ctx.lineTo(W,H*.66);ctx.lineTo(0,H*.66);ctx.fill();
 // grassy sides
 let grass=ctx.createLinearGradient(0,H*.48,0,H);grass.addColorStop(0,'#2d8e41');grass.addColorStop(1,'#0c501f');ctx.fillStyle=grass;ctx.fillRect(0,H*.47,W,H*.53);
}

function road(){
 const horizon=H*.38;
 // shoulder
 ctx.fillStyle='#9c7c4b';ctx.beginPath();ctx.moveTo(W/2-58,horizon);ctx.lineTo(W/2+58,horizon);ctx.lineTo(W/2+W*.42,H);ctx.lineTo(W/2-W*.42,H);ctx.closePath();ctx.fill();
 // asphalt with depth gradient
 let a=ctx.createLinearGradient(0,horizon,0,H);a.addColorStop(0,'#5e6065');a.addColorStop(.55,'#3c3d41');a.addColorStop(1,'#222327');ctx.fillStyle=a;ctx.beginPath();ctx.moveTo(W/2-50,horizon);ctx.lineTo(W/2+50,horizon);ctx.lineTo(W/2+W*.39,H);ctx.lineTo(W/2-W*.39,H);ctx.closePath();ctx.fill();
 // subtle horizontal texture bands
 for(let y=horizon;y<H;y+=18){let p=(y-horizon)/(H-horizon);ctx.fillStyle=`rgba(255,255,255,${.018*(1-p)})`;ctx.fillRect(roadLeft(y),y,roadWidth(y),2)}
 // edge lines
 ctx.strokeStyle='#f8fafc';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(W/2-50,horizon);ctx.lineTo(W/2-W*.39,H);ctx.stroke();ctx.beginPath();ctx.moveTo(W/2+50,horizon);ctx.lineTo(W/2+W*.39,H);ctx.stroke();
 // dashed lane lines
 ctx.strokeStyle='#ececec';ctx.lineCap='round';
 for(let lane of [-.18,.18]){
   for(let i=0;i<13;i++){
     let z=((i*85+roadOffset)%900)/900;
     let y=horizon+(H-horizon)*z*z;
     let y2=horizon+(H-horizon)*Math.min(1,(z+.055))**2;
     let x=W/2+lane*roadWidth(y);
     let x2=W/2+lane*roadWidth(y2);
     ctx.lineWidth=1+5*z;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();
   }
 }
}

function tireBarrier(x,y,sc){
 ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
 for(let i=0;i<5;i++){ctx.fillStyle=i%3===0?'#b91c1c':i%3===1?'#e5e7eb':'#111827';ctx.beginPath();ctx.ellipse((i-2)*10,0,9,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2b2b2b';ctx.beginPath();ctx.ellipse((i-2)*10,0,4,2.5,0,0,Math.PI*2);ctx.fill()}
 ctx.restore();
}
function cafe(x,y,sc,flip){
 ctx.save();ctx.translate(x,y);ctx.scale((flip?-1:1)*sc,sc);
 ctx.fillStyle='#4a2b1d';ctx.fillRect(-58,-55,116,55);ctx.fillStyle='#762e24';ctx.beginPath();ctx.moveTo(-67,-55);ctx.lineTo(0,-85);ctx.lineTo(67,-55);ctx.closePath();ctx.fill();
 ctx.fillStyle='#fff4d6';ctx.fillRect(-50,-45,100,16);ctx.fillStyle='#c9362a';for(let i=-50;i<50;i+=20)ctx.fillRect(i,-45,10,16);
 ctx.fillStyle='#202020';ctx.fillRect(-42,-20,84,20);ctx.fillStyle='#f6e7bf';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText('COFFEE SHOP',0,-7);
 ctx.restore();
}
function scenery(){
 const horizon=H*.38;
 // cafe appears periodically to one side
 let cy=horizon+((frame*1.4)%1200);
 if(cy<horizon+H*.5){let sc=.35+((cy-horizon)/(H-horizon))*.7;cafe(roadLeft(cy)-100*sc,cy,sc,false)}
 // barriers and spectators
 const fans=['🧑','👩','👨','👧','👦','🙋','🙋‍♀️','🙋‍♂️'];
 for(let i=0;i<18;i++){
   let z=((i*73+roadOffset*1.25)%1100)/1100;
   let y=horizon+(H-horizon)*z*z;
   let sc=.30+.95*z;
   let l=roadLeft(y),rw=roadWidth(y);
   tireBarrier(l-18,y,sc);tireBarrier(l+rw+18,y,sc);
   if(i%2===0){
     ctx.font=(22*sc)+'px Arial';ctx.textAlign='center';
     ctx.fillText(fans[i%fans.length],l-52*sc,y-3*sc);ctx.fillText(fans[(i+3)%fans.length],l+rw+52*sc,y-3*sc);
     if(i%4===0){ctx.font=(15*sc)+'px Arial';ctx.fillText('🏁',l-67*sc,y-18*sc);ctx.fillText('🚩',l+rw+67*sc,y-18*sc)}
   }
 }
 // trees farther back
 for(let i=0;i<14;i++){
   let z=((i*95+roadOffset*.75)%1300)/1300;
   let y=horizon+(H-horizon)*z*z,sc=.30+.85*z,l=roadLeft(y),rw=roadWidth(y);
   ctx.font=(34*sc)+'px Arial';ctx.textAlign='center';ctx.fillText(i%4===0?'🌴':'🌳',l-105*sc,y);ctx.fillText(i%5===0?'🌴':'🌳',l+rw+105*sc,y);
 }
}

function spawnTraffic(){
 if(frame%100===0){
   const lanes=[-.24,0,.24],lane=lanes[Math.floor(Math.random()*lanes.length)];
   traffic.push({lane,y:H*.36-40,speed:1.8+Math.random()*.8,car:cars[Math.floor(Math.random()*cars.length)]});
 }
}
function spawnCoin(){
 if(frame%82===0){
   const lanes=[-.24,0,.24];coinList.push({lane:lanes[Math.floor(Math.random()*3)],y:H*.36-20,speed:2.2});
 }
}
function tx(obj){return W/2+obj.lane*roadWidth(obj.y)}
function collide(obj){
 if(invincible||paused)return false;
 return Math.abs(tx(obj)-playerX)<42 && Math.abs(obj.y-playerY)<73;
}
function crash(){
 if(invincible||paused)return;
 lives--;updateLives();crashSound();stopMusic();paused=true;invincible=true;burst(playerX,playerY);$('crashMsg').style.display='block';
 setTimeout(()=>{$('crashMsg').style.display='none';if(lives<=0){playing=false;paused=true;$('gameOver').style.display='block';return}
 traffic=[];coinList=[];playerX=W/2;paused=false;startMusic();setTimeout(()=>invincible=false,1300)},900);
}
function trafficUpdate(){
 for(let i=traffic.length-1;i>=0;i--){
   const t=traffic[i];t.y+=(2.0+t.speed)*(speed/5.2);
   let z=(t.y-H*.36)/(H-H*.36),sc=.34+Math.max(0,z)*.82;
   vehicle(ctx,tx(t),t.y,sc,t.car,true);
   if(collide(t)){traffic.splice(i,1);crash();continue}
   if(t.y>H+100){traffic.splice(i,1);score+=100;$('score').textContent=score;if(score%1500===0)cheer()}
 }
}
function coinsUpdate(){
 for(let i=coinList.length-1;i>=0;i--){
   let c=coinList[i];c.y+=3.0*(speed/5.2);let x=tx(c),z=(c.y-H*.36)/(H-H*.36),sc=.45+Math.max(0,z)*.7;
   ctx.save();ctx.translate(x,c.y);ctx.scale(sc,sc);ctx.shadowBlur=18;ctx.shadowColor='#ffd43b';ctx.fillStyle='#ffc300';ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff3a3';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText('★',0,5);ctx.restore();
   if(Math.abs(x-playerX)<38&&Math.abs(c.y-playerY)<58){coinList.splice(i,1);coins++;score+=25;$('coins').textContent=coins;$('score').textContent=score;coinSound();continue}
   if(c.y>H+50)coinList.splice(i,1);
 }
}
function move(){
 if(leftHeld)playerX-=7;if(rightHeld)playerX+=7;
 speed=nitroHeld?7.4:5.2;$('speedTxt').textContent=nitroHeld?'180':'125';
 const l=roadLeft(playerY),rw=roadWidth(playerY);playerX=Math.max(l+42,Math.min(l+rw-42,playerX));
}
function player(){
 vehicle(ctx,playerX,playerY,1.07,selectedCar,false);
 if(nitroHeld){
   ctx.save();ctx.globalCompositeOperation='lighter';
   let g=ctx.createLinearGradient(playerX,playerY+30,playerX,playerY+105);g.addColorStop(0,'#fff');g.addColorStop(.25,'#00b4ff');g.addColorStop(.55,'#ff9f1c');g.addColorStop(1,'rgba(255,80,0,0)');ctx.fillStyle=g;
   ctx.beginPath();ctx.moveTo(playerX-16,playerY+38);ctx.lineTo(playerX-7,playerY+95+Math.random()*20);ctx.lineTo(playerX,playerY+42);ctx.lineTo(playerX+7,playerY+95+Math.random()*20);ctx.lineTo(playerX+16,playerY+38);ctx.closePath();ctx.fill();ctx.restore();
 }
}
function burst(x,y){for(let i=0;i<26;i++)particles.push({x,y,vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*9-2,life:30+Math.random()*18})}
function particlesUpdate(){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life--;ctx.fillStyle=i%2?'#ffd43b':'#ff4d2e';ctx.fillRect(p.x,p.y,5,5);if(p.life<=0)particles.splice(i,1)}}
function cheer(){$('cheer').style.display='block';cheerSound();setTimeout(()=>$('cheer').style.display='none',950)}

function loop(){
 requestAnimationFrame(loop);if(!playing)return;
 background();road();scenery();
 if(!paused){frame++;roadOffset+=speed;spawnTraffic();spawnCoin();trafficUpdate();coinsUpdate();move()}
 else{traffic.forEach(t=>vehicle(ctx,tx(t),t.y,.34+Math.max(0,(t.y-H*.36)/(H-H*.36))*.82,t.car,true))}
 player();particlesUpdate();
}
loop();

function audio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(f,d,v,type='triangle'){if(!soundOn)return;audio();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}
function coinSound(){tone(990,.06,.03);setTimeout(()=>tone(1480,.07,.025),60)}
function crashSound(){tone(150,.09,.06,'sawtooth');setTimeout(()=>tone(90,.17,.05,'square'),70);setTimeout(()=>tone(60,.22,.04,'sawtooth'),145)}
function cheerSound(){[659,784,988,1175].forEach((n,i)=>setTimeout(()=>tone(n,.10,.026),i*80))}
function startMusic(){
 stopMusic();if(!soundOn)return;musicStep=0;
 const melody=[392,523,659,784,659,523,440,587,698,880,698,587,494,659,784,988,784,659];
 musicTimer=setInterval(()=>{if(!playing||paused||!soundOn)return;let i=musicStep++;tone(melody[i%melody.length],.09,.010,'triangle');if(i%3===0)tone(98+(i%4)*12,.06,.004,'square')},330);
}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}

$('playHome').onclick=startGame;$('playGarage').onclick=startGame;$('garageHome').onclick=()=>show('garage');$('driverHome').onclick=()=>show('driver');$('homeBtn').onclick=()=>show('home');$('restartBtn').onclick=()=>{$('gameOver').style.display='none';startGame()};
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show('home'));
document.querySelectorAll('.driverChoice').forEach(el=>el.onclick=()=>{document.querySelectorAll('.driverChoice').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');selectedDriver=el.dataset.driver});
$('soundBtn').onclick=()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊':'🔇';if(soundOn&&playing&&!paused)startMusic();else stopMusic()};

function hold(btn,which){
 const on=e=>{e.preventDefault();if(which==='L')leftHeld=true;else if(which==='R')rightHeld=true;else nitroHeld=true};
 const off=e=>{e.preventDefault();if(which==='L')leftHeld=false;else if(which==='R')rightHeld=false;else nitroHeld=false};
 btn.addEventListener('touchstart',on,{passive:false});btn.addEventListener('touchend',off,{passive:false});btn.addEventListener('touchcancel',off,{passive:false});btn.addEventListener('mousedown',on);btn.addEventListener('mouseup',off);btn.addEventListener('mouseleave',off);
}
hold($('left'),'L');hold($('right'),'R');hold($('nitro'),'N');
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')leftHeld=true;if(e.key==='ArrowRight')rightHeld=true;if(e.key===' ')nitroHeld=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')leftHeld=false;if(e.key==='ArrowRight')rightHeld=false;if(e.key===' ')nitroHeld=false});
})();
</script>
