<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Liam Car Games</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#72cfff;touch-action:none}
button{font-family:inherit;font-weight:900}
.screen{position:fixed;inset:0;display:none}
.screen.show{display:block}
#home{background:linear-gradient(#74d2ff 0 55%,#67bf4e 55%);text-align:center;color:#fff}
.logo{margin-top:5vh;font-size:clamp(30px,7vw,58px);font-weight:900;text-shadow:0 4px 0 #18579d,0 7px 12px #0004}
.sub{font-size:18px;margin:8px 0 16px;text-shadow:0 2px 4px #0005}
#driverIcon{font-size:64px;margin:8px}
.big{display:block;width:min(320px,78vw);margin:12px auto;padding:15px;border:0;border-radius:22px;font-size:23px;box-shadow:0 7px 0 #0003}
.play{background:#ffd43b;color:#3c2a00}
.garageBtn{background:#29adf1;color:#fff}
.driverBtn{background:#ff7e9f;color:#fff}
#garage,#driver{background:linear-gradient(#e4f7ff,#8dd5ff);padding:16px;text-align:center;overflow:auto}
.panel{background:#fff;border-radius:24px;padding:18px;max-width:760px;margin:12px auto;box-shadow:0 8px 24px #0002}
.back{position:fixed;top:12px;left:12px;border:0;border-radius:14px;padding:10px 14px;font-size:21px;z-index:30}
.carChoice{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:104px;height:104px;margin:7px;border:5px solid transparent;border-radius:22px;background:#edf8ff;font-size:43px;box-shadow:0 4px 10px #0002}
.carChoice.sel{border-color:#ffd43b;transform:translateY(-3px)}
.carChoice span{font-size:12px;color:#234}
.driverChoice{display:inline-flex;align-items:center;justify-content:center;width:88px;height:88px;margin:7px;border:5px solid transparent;border-radius:22px;background:#eef7ff;font-size:49px}
.driverChoice.sel{border-color:#ffd43b}
#game{background:#63ba4d}
canvas{width:100%;height:100%;display:block}
#hud{position:fixed;top:10px;left:12px;color:#fff;font-size:18px;font-weight:900;text-shadow:0 2px 4px #000;z-index:10}
#homeBtn,#soundBtn{position:fixed;right:12px;border:0;border-radius:12px;padding:9px 12px;z-index:11}
#homeBtn{top:10px}
#soundBtn{top:52px;font-size:18px}
.ctrl{position:fixed;bottom:22px;width:78px;height:78px;border-radius:50%;border:4px solid #fff;background:#176fd0cc;color:#fff;font-size:35px;z-index:12}
#left{left:22px} #right{right:22px}
#cheer{position:fixed;left:50%;top:20%;transform:translate(-50%,-50%);width:min(240px,52vw);padding:7px 10px;border:3px solid #fff;border-radius:14px;background:linear-gradient(135deg,#fff7a8,#ffd43b,#ffb44b);color:#6a4300;text-align:center;font-weight:900;font-size:clamp(14px,3vw,20px);box-shadow:0 6px 15px #0004;z-index:40;display:none}
#cheer small{display:block;font-size:11px;margin-top:2px}
</style>
</head>
<body>

<section id="home" class="screen show">
  <div class="logo">🏁 LIAM CAR GAMES 🏁</div>
  <div class="sub">Drive • Collect • Have Fun!</div>
  <div id="driverIcon">🧒</div>
  <button class="big play" id="playHome">▶ PLAY</button>
  <button class="big garageBtn" id="garageHome">🚗 MY GARAGE</button>
  <button class="big driverBtn" id="driverHome">🙂 MY DRIVER</button>
</section>

<section id="garage" class="screen">
  <button class="back" data-back>←</button>
  <div class="panel">
    <h2>Choose Your Car</h2>
    <div class="carChoice sel" data-car="🏎️">🏎️<span>SPORT</span></div>
    <div class="carChoice" data-car="🚙">🚙<span>SUV</span></div>
    <div class="carChoice" data-car="🛻">🛻<span>TRUCK</span></div>
    <div class="carChoice" data-car="🚓">🚓<span>POLICE</span></div>
    <div class="carChoice" data-car="🚕">🚕<span>TAXI</span></div>
    <div class="carChoice" data-car="🚒">🚒<span>FIRE</span></div>
    <div class="carChoice" data-car="🚑">🚑<span>AMBULANCE</span></div>
    <div class="carChoice" data-car="🚐">🚐<span>VAN</span></div>
    <div class="carChoice" data-car="🚘">🚘<span>CAR</span></div>
    <div class="carChoice" data-car="🏁">🏁<span>RACER</span></div>
    <button class="big play" id="playGarage">▶ PLAY</button>
  </div>
</section>

<section id="driver" class="screen">
  <button class="back" data-back>←</button>
  <div class="panel">
    <h2>Choose Your Driver</h2>
    <div class="driverChoice sel" data-driver="🧒">🧒</div>
    <div class="driverChoice" data-driver="👦">👦</div>
    <div class="driverChoice" data-driver="👧">👧</div>
    <div class="driverChoice" data-driver="🧑">🧑</div>
    <button class="big play" data-back>✓ DONE</button>
  </div>
</section>

<section id="game" class="screen">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">🪙 <span id="coins">0</span> &nbsp; 🚗 <span id="passed">0</span></div>
  <button id="homeBtn">HOME</button>
  <button id="soundBtn">🔊</button>
  <button id="left" class="ctrl">◀</button>
  <button id="right" class="ctrl">▶</button>
</section>

<div id="cheer">🎊 GREAT JOB! 🎊<small>Keep going!</small></div>

<script>
(function(){
'use strict';

const $ = id => document.getElementById(id);
const screens = document.querySelectorAll('.screen');
const canvas = $('gameCanvas');
const ctx = canvas.getContext('2d');

let W=0,H=0,playing=false,frame=0;
let selectedCar='🏎️', selectedDriver='🧒';
let playerX=0, playerY=0, leftHeld=false, rightHeld=false;
let coins=0, passed=0;
let traffic=[], coinList=[];
let soundOn=true, audioCtx=null, musicTimer=null;
const animals=['🐄','🐎','🐑','🐕','🦌','🐖','🐐','🦙'];
const trafficCars=['🚗','🚙','🚕','🚓','🛻','🚐','🚑'];

function show(id){
  screens.forEach(s=>s.classList.remove('show'));
  $(id).classList.add('show');
  playing = id==='game';
  if(!playing) stopMusic();
}

function resize(){
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;
  playerY=H-120;
  if(!playerX) playerX=W/2;
}
addEventListener('resize',resize);
resize();

function roadWidth(y){
  const top=150, bottom=W*0.72;
  return top + (bottom-top)*(y/H);
}
function roadLeft(y){ return W/2-roadWidth(y)/2; }

function startGame(){
  coins=0; passed=0; frame=0; traffic=[]; coinList=[];
  $('coins').textContent='0';
  $('passed').textContent='0';
  playerX=W/2; playerY=H-120;
  show('game');
  startMusic();
}

function drawBackground(){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#74d4ff');
  sky.addColorStop(.54,'#d6f4ff');
  sky.addColorStop(.55,'#65c052');
  sky.addColorStop(1,'#3f9e35');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#fff';
  for(let i=0;i<5;i++){
    const x=(i*250+100-frame*.12)%(W+300)-120;
    const y=70+(i%2)*35;
    ctx.beginPath();
    ctx.arc(x,y,25,0,Math.PI*2);
    ctx.arc(x+28,y-5,32,0,Math.PI*2);
    ctx.arc(x+58,y+2,24,0,Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle='#3a8c32';
  ctx.beginPath();
  ctx.moveTo(0,H*.52);
  ctx.lineTo(W*.15,H*.34);
  ctx.lineTo(W*.30,H*.52);
  ctx.lineTo(W*.46,H*.30);
  ctx.lineTo(W*.63,H*.52);
  ctx.lineTo(W*.79,H*.35);
  ctx.lineTo(W,H*.52);
  ctx.closePath(); ctx.fill();
}


function drawRoad(){
  // soft shoulders
  ctx.fillStyle='#d7c7a1';
  ctx.beginPath();
  ctx.moveTo(W/2-88,0);
  ctx.lineTo(W/2+88,0);
  ctx.lineTo(W/2+W*.395,H);
  ctx.lineTo(W/2-W*.395,H);
  ctx.closePath(); ctx.fill();

  // asphalt
  const asphalt=ctx.createLinearGradient(0,0,0,H);
  asphalt.addColorStop(0,'#51545a');
  asphalt.addColorStop(1,'#2f3135');
  ctx.fillStyle=asphalt;
  ctx.beginPath();
  ctx.moveTo(W/2-75,0);
  ctx.lineTo(W/2+75,0);
  ctx.lineTo(W/2+W*.37,H);
  ctx.lineTo(W/2-W*.37,H);
  ctx.closePath(); ctx.fill();

  // edge lines
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(W/2-75,0); ctx.lineTo(W/2-W*.37,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W/2+75,0); ctx.lineTo(W/2+W*.37,H); ctx.stroke();

  // moving center line
  ctx.strokeStyle='#ffd43b'; ctx.lineWidth=5;
  for(let y=(frame*8)%160-160;y<H;y+=160){
    const seg=58+(y/H)*24;
    ctx.beginPath(); ctx.moveTo(W/2,y); ctx.lineTo(W/2,y+seg); ctx.stroke();
  }

  // little road reflectors
  for(let y=(frame*6)%120-120;y<H;y+=120){
    const l=roadLeft(y), rw=roadWidth(y);
    ctx.fillStyle='#f8fafc';
    ctx.fillRect(l+8,y,4,8);
    ctx.fillRect(l+rw-12,y,4,8);
  }
}

function drawScenery(){
  // trees + palms
  for(let i=0;i<11;i++){
    const y=((frame*2.6+i*115)%(H+150))-75;
    const left=roadLeft(y), rw=roadWidth(y), side=i%2===0?-1:1;
    const x=side<0?left-58-(i%3)*25:left+rw+58+(i%3)*25;
    const scale=.55+(y/H)*.75;
    ctx.font=(42*scale)+'px Arial'; ctx.textAlign='center';
    ctx.fillText(i%4===0?'🌴':'🌳',x,y);
  }

  // animals
  for(let i=0;i<8;i++){
    const y=((frame*2.0+i*185)%(H+180))-90;
    const left=roadLeft(y), rw=roadWidth(y), side=i%2===0?-1:1;
    const x=side<0?left-112:left+rw+112;
    const scale=.52+(y/H)*.62;
    ctx.font=(31*scale)+'px Arial'; ctx.textAlign='center';
    ctx.fillText(animals[i%animals.length],x,y);
  }

  // flowers
  for(let i=0;i<14;i++){
    const y=((frame*1.8+i*95)%(H+100))-50;
    const left=roadLeft(y), rw=roadWidth(y);
    const side=i%2===0?-1:1;
    const x=side<0?left-30-(i%4)*18:left+rw+30+(i%4)*18;
    ctx.font='16px Arial';
    ctx.fillText(i%3===0?'🌼':'🌸',x,y);
  }

  // signs every so often
  for(let i=0;i<3;i++){
    const y=((frame*1.5+i*420)%(H+300))-150;
    const left=roadLeft(y), rw=roadWidth(y);
    const x=i%2===0?left-72:left+rw+72;
    ctx.font='28px Arial';
    ctx.fillText(i%2===0?'🚸':'⭐',x,y);
  }
}

function spawnTraffic(){
  if(frame%115===0){
    traffic.push({
      offset:(Math.random()-.5)*.34,
      y:-80,
      speed:2.5+Math.random()*0.9,
      icon:trafficCars[Math.floor(Math.random()*trafficCars.length)]
    });
  }
}
function spawnCoin(){
  if(frame%95===0){
    coinList.push({
      offset:(Math.random()-.5)*.38,
      y:-40,
      speed:5
    });
  }
}


function drawTopCar(x,y,kind){
  const colors={
    '🚗':'#ef4444','🚙':'#2563eb','🚕':'#ffd43b','🚓':'#f8fafc',
    '🛻':'#22c55e','🚐':'#a855f7','🚑':'#ffffff'
  };
  const c=colors[kind]||'#ff4d6d';
  ctx.save();
  ctx.translate(x,y);
  ctx.fillStyle='#111827';
  ctx.fillRect(-24,-34,8,18); ctx.fillRect(16,-34,8,18);
  ctx.fillRect(-24,16,8,18); ctx.fillRect(16,16,8,18);
  ctx.fillStyle=c;
  ctx.beginPath();
  ctx.roundRect(-20,-42,40,84,11);
  ctx.fill();
  ctx.fillStyle='#9ee7ff';
  ctx.fillRect(-13,-25,26,18);
  ctx.fillRect(-13,10,26,15);
  ctx.fillStyle='#ffffff';
  ctx.fillRect(-14,-39,9,5); ctx.fillRect(5,-39,9,5);
  if(kind==='🚓'){
    ctx.fillStyle='#ef4444'; ctx.fillRect(-12,-4,11,6);
    ctx.fillStyle='#2563eb'; ctx.fillRect(1,-4,11,6);
  }
  if(kind==='🚑'){
    ctx.fillStyle='#ef4444';
    ctx.fillRect(-3,-9,6,18); ctx.fillRect(-9,-3,18,6);
  }
  ctx.restore();
}

function updateTraffic(){
  for(let i=traffic.length-1;i>=0;i--){
    const t=traffic[i]; t.y+=t.speed;
    const x=W/2+t.offset*roadWidth(t.y);
    drawTopCar(x,t.y,t.icon);
    if(t.y>H+80){
      traffic.splice(i,1);
      passed++;
      $('passed').textContent=passed;
      if(passed%15===0) showCheer();
    }
  }
}

function updateCoins(){
  for(let i=coinList.length-1;i>=0;i--){
    const c=coinList[i]; c.y+=c.speed;
    const x=W/2+c.offset*roadWidth(c.y);
    ctx.font='30px Arial'; ctx.textAlign='center';
    ctx.fillText('🪙',x,c.y);
    if(Math.abs(x-playerX)<40 && Math.abs(c.y-playerY)<55){
      coinList.splice(i,1);
      coins++; $('coins').textContent=coins; coinSound(); continue;
    }
    if(c.y>H+50) coinList.splice(i,1);
  }
}

function movePlayer(){
  if(leftHeld) playerX-=7;
  if(rightHeld) playerX+=7;
  const left=roadLeft(playerY), rw=roadWidth(playerY);
  playerX=Math.max(left+38,Math.min(left+rw-38,playerX));
}


function playerColor(kind){
  const colors={
    '🏎️':'#ef233c',
    '🚙':'#2563eb',
    '🛻':'#16a34a',
    '🚓':'#f8fafc',
    '🚕':'#facc15',
    '🚒':'#dc2626',
    '🚑':'#ffffff',
    '🚐':'#8b5cf6',
    '🚘':'#06b6d4',
    '🏁':'#111827'
  };
  return colors[kind]||'#ef233c';
}

function wheel(x,y,w,h){
  ctx.fillStyle='#111';
  ctx.fillRect(x,y,w,h);
}
function glass(x,y,w,h,r){
  ctx.fillStyle='#9ee7ff';
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r||5);
  ctx.fill();
}
function lightPair(y){
  ctx.fillStyle='#fff7b2';
  ctx.fillRect(-15,y,9,5);
  ctx.fillRect(6,y,9,5);
}

function drawPlayerCar(x,y,kind){
  const c=playerColor(kind);
  ctx.save();
  ctx.translate(x,y);

  ctx.fillStyle='rgba(0,0,0,.24)';
  ctx.beginPath();
  ctx.ellipse(0,8,33,50,0,0,Math.PI*2);
  ctx.fill();

  if(kind==='🏎️' || kind==='🏁'){
    // SPORT / RACER: low and pointed
    wheel(-27,-30,7,20); wheel(20,-30,7,20);
    wheel(-27,16,7,20); wheel(20,16,7,20);
    ctx.fillStyle=c;
    ctx.beginPath();
    ctx.moveTo(0,-51); ctx.lineTo(20,-38); ctx.lineTo(24,26);
    ctx.lineTo(14,45); ctx.lineTo(-14,45); ctx.lineTo(-24,26);
    ctx.lineTo(-20,-38); ctx.closePath(); ctx.fill();
    glass(-14,-25,28,18,6); glass(-13,9,26,17,5);
    ctx.fillStyle=kind==='🏁'?'#facc15':'#111827';
    ctx.fillRect(-4,-44,8,84);
    lightPair(-44);
    if(kind==='🏁'){
      ctx.fillStyle='#fff';
      for(let yy=-8;yy<28;yy+=10){
        ctx.fillRect(-16,yy,8,8);
        ctx.fillRect(0,yy+8,8,8);
      }
    }
  } else if(kind==='🚙'){
    // SUV: tall, wide
    wheel(-30,-31,8,22); wheel(22,-31,8,22);
    wheel(-30,15,8,22); wheel(22,15,8,22);
    ctx.fillStyle=c;
    ctx.beginPath(); ctx.roundRect(-25,-48,50,96,12); ctx.fill();
    glass(-17,-27,34,20,5); glass(-17,10,34,22,5);
    ctx.fillStyle='#dbeafe'; ctx.fillRect(-18,-2,36,7);
    lightPair(-44);
  } else if(kind==='🛻'){
    // PICKUP: cab + open bed
    wheel(-29,-28,8,20); wheel(21,-28,8,20);
    wheel(-29,18,8,20); wheel(21,18,8,20);
    ctx.fillStyle=c;
    ctx.beginPath(); ctx.roundRect(-24,-47,48,53,10); ctx.fill();
    glass(-16,-29,32,18,5); lightPair(-43);
    ctx.strokeStyle=c; ctx.lineWidth=6;
    ctx.strokeRect(-21,10,42,34);
    ctx.fillStyle='#6b7280'; ctx.fillRect(-17,14,34,26);
  } else if(kind==='🚓'){
    // POLICE
    wheel(-28,-31,8,21); wheel(20,-31,8,21);
    wheel(-28,15,8,21); wheel(20,15,8,21);
    ctx.fillStyle='#f8fafc';
    ctx.beginPath(); ctx.roundRect(-23,-48,46,96,11); ctx.fill();
    ctx.fillStyle='#1f2937'; ctx.fillRect(-23,6,46,18);
    glass(-15,-27,30,18,5); glass(-15,26,30,12,5);
    ctx.fillStyle='#ef4444'; ctx.fillRect(-13,-5,12,7);
    ctx.fillStyle='#2563eb'; ctx.fillRect(1,-5,12,7);
    lightPair(-44);
  } else if(kind==='🚕'){
    // TAXI
    wheel(-28,-31,8,21); wheel(20,-31,8,21);
    wheel(-28,15,8,21); wheel(20,15,8,21);
    ctx.fillStyle=c;
    ctx.beginPath(); ctx.roundRect(-23,-48,46,96,11); ctx.fill();
    glass(-15,-27,30,18,5); glass(-15,12,30,18,5);
    ctx.fillStyle='#111'; ctx.fillRect(-23,2,46,7);
    ctx.fillStyle='#fff'; ctx.font='11px Arial'; ctx.textAlign='center';
    ctx.fillText('TAXI',0,-1);
    lightPair(-44);
  } else if(kind==='🚒'){
    // FIRE TRUCK
    wheel(-31,-31,9,22); wheel(22,-31,9,22);
    wheel(-31,17,9,22); wheel(22,17,9,22);
    ctx.fillStyle=c;
    ctx.beginPath(); ctx.roundRect(-27,-50,54,100,8); ctx.fill();
    glass(-18,-31,36,18,4);
    ctx.fillStyle='#fde047'; ctx.fillRect(-21,-5,42,7);
    ctx.fillStyle='#d1d5db';
    ctx.fillRect(-4,5,8,36);
    for(let yy=7;yy<40;yy+=8) ctx.fillRect(-11,yy,22,3);
    lightPair(-46);
  } else if(kind==='🚑'){
    // AMBULANCE
    wheel(-30,-31,8,22); wheel(22,-31,8,22);
    wheel(-30,17,8,22); wheel(22,17,8,22);
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.roundRect(-26,-50,52,100,9); ctx.fill();
    glass(-18,-31,36,18,4);
    ctx.fillStyle='#ef4444';
    ctx.fillRect(-4,-4,8,28); ctx.fillRect(-14,6,28,8);
    ctx.fillRect(-26,29,52,7);
    lightPair(-46);
  } else if(kind==='🚐'){
    // VAN
    wheel(-29,-31,8,22); wheel(21,-31,8,22);
    wheel(-29,17,8,22); wheel(21,17,8,22);
    ctx.fillStyle=c;
    ctx.beginPath(); ctx.roundRect(-25,-50,50,100,12); ctx.fill();
    glass(-17,-31,34,18,4);
    ctx.fillStyle='#c4b5fd';
    ctx.fillRect(-17,-5,34,13); ctx.fillRect(-17,15,34,13);
    lightPair(-46);
  } else {
    // REGULAR CAR
    wheel(-27,-30,7,20); wheel(20,-30,7,20);
    wheel(-27,16,7,20); wheel(20,16,7,20);
    ctx.fillStyle=c;
    ctx.beginPath(); ctx.roundRect(-22,-47,44,94,12); ctx.fill();
    glass(-14,-26,28,18,5); glass(-14,11,28,18,5);
    lightPair(-43);
  }

  ctx.restore();

  ctx.font='21px Arial';
  ctx.textAlign='center';
  ctx.fillText(selectedDriver,x,y-63);
}

function drawPlayer(){
  drawPlayerCar(playerX,playerY,selectedCar);
}

function loop(){
  requestAnimationFrame(loop);
  if(!playing) return;
  frame++;
  drawBackground();
  drawRoad();
  drawScenery();
  spawnTraffic();
  spawnCoin();
  updateTraffic();
  updateCoins();
  movePlayer();
  drawPlayer();
}
loop();

function showCheer(){
  const el=$('cheer');
  el.style.display='block';
  playCheer();
  setTimeout(()=>el.style.display='none',1100);
}

function ensureAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
}
function beep(freq,dur,vol){
  if(!soundOn) return;
  ensureAudio();
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type='sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(Math.max(.0001,vol),audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+dur);
}
function coinSound(){
  beep(988,.07,.035);
  setTimeout(()=>beep(1319,.09,.03),75);
}
function playCheer(){
  beep(659,.10,.035);
  setTimeout(()=>beep(784,.10,.035),105);
  setTimeout(()=>beep(988,.13,.04),210);
  setTimeout(()=>beep(1175,.16,.04),330);
}
function startMusic(){
  stopMusic();
  if(!soundOn) return;
  const melody=[
    523,659,784,659,
    587,698,880,698,
    659,784,988,784,
    587,659,784,523
  ];
  let i=0;
  musicTimer=setInterval(()=>{
    if(playing&&soundOn){
      const n=melody[i%melody.length];
      beep(n,.13,.014);
      if(i%4===0){
        setTimeout(()=>beep(n/2,.09,.004),65);
      }
      i++;
    }
  },460);
}
function stopMusic(){
  if(musicTimer){ clearInterval(musicTimer); musicTimer=null; }
}

$('playHome').addEventListener('click',startGame);
$('playGarage').addEventListener('click',startGame);
$('garageHome').addEventListener('click',()=>show('garage'));
$('driverHome').addEventListener('click',()=>show('driver'));
$('homeBtn').addEventListener('click',()=>show('home'));

document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>show('home')));

document.querySelectorAll('.carChoice').forEach(el=>{
  el.addEventListener('click',()=>{
    document.querySelectorAll('.carChoice').forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel');
    selectedCar=el.dataset.car;
  });
});

document.querySelectorAll('.driverChoice').forEach(el=>{
  el.addEventListener('click',()=>{
    document.querySelectorAll('.driverChoice').forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel');
    selectedDriver=el.dataset.driver;
    $('driverIcon').textContent=selectedDriver;
  });
});

$('soundBtn').addEventListener('click',()=>{
  soundOn=!soundOn;
  $('soundBtn').textContent=soundOn?'🔊':'🔇';
  if(soundOn&&playing) startMusic(); else stopMusic();
});

function hold(btn,side){
  const on=e=>{e.preventDefault(); if(side==='L') leftHeld=true; else rightHeld=true;};
  const off=e=>{e.preventDefault(); if(side==='L') leftHeld=false; else rightHeld=false;};
  btn.addEventListener('touchstart',on,{passive:false});
  btn.addEventListener('touchend',off,{passive:false});
  btn.addEventListener('touchcancel',off,{passive:false});
  btn.addEventListener('mousedown',on);
  btn.addEventListener('mouseup',off);
  btn.addEventListener('mouseleave',off);
}
hold($('left'),'L'); hold($('right'),'R');

addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') leftHeld=true;
  if(e.key==='ArrowRight') rightHeld=true;
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft') leftHeld=false;
  if(e.key==='ArrowRight') rightHeld=false;
});

})();
</script>
