<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Liam Car Games</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
background:#77cfff;
touch-action:none
}

button{font-family:Arial,sans-serif;font-weight:bold}

.screen{
position:fixed;
inset:0;
display:none
}

.show{display:block}

#home{
background:linear-gradient(#73cfff 0 55%,#65be4c 55%);
text-align:center;
color:white
}

.logo{
margin-top:6vh;
font-size:clamp(28px,7vw,58px);
font-weight:900;
text-shadow:0 4px #1957a5
}

.subtitle{
font-size:18px;
margin:10px 0 20px
}

#driverIcon{
font-size:65px;
margin:10px
}

.big{
display:block;
width:min(310px,78vw);
margin:12px auto;
padding:15px;
border:none;
border-radius:22px;
font-size:23px;
box-shadow:0 6px 0 #0003
}

.play{background:#ffd43b;color:#4a3600}
.garageBtn{background:#28aef2;color:#fff}
.driverBtn{background:#ff7c9c;color:#fff}

#garage,#driver{
background:linear-gradient(#dff5ff,#8bd1ff);
text-align:center;
padding:15px;
overflow:auto
}

.panel{
max-width:720px;
margin:15px auto;
background:#fff;
border-radius:24px;
padding:18px;
box-shadow:0 8px 24px #0002
}

.back{
position:fixed;
left:12px;
top:12px;
z-index:20;
border:0;
border-radius:12px;
padding:10px 14px;
font-size:20px
}

.carChoice{
display:inline-flex;
flex-direction:column;
align-items:center;
justify-content:center;
width:105px;
height:100px;
margin:7px;
border:5px solid transparent;
border-radius:20px;
background:#edf8ff;
font-size:43px
}

.carChoice.sel{
border-color:#ffd43b;
transform:scale(1.04)
}

.carChoice span{
font-size:12px;
color:#234
}

.driverChoice{
display:inline-flex;
align-items:center;
justify-content:center;
width:85px;
height:85px;
font-size:48px;
margin:7px;
border-radius:20px;
border:5px solid transparent;
background:#eef7ff
}

.driverChoice.sel{border-color:#ffd43b}

#game{background:#5ab84b}

canvas{
width:100%;
height:100%;
display:block
}

#hud{
position:fixed;
left:14px;
top:10px;
color:#fff;
font-size:18px;
font-weight:bold;
text-shadow:0 2px 4px #000;
z-index:8
}

#homeBtn{
position:fixed;
right:12px;
top:10px;
z-index:10;
border:0;
border-radius:12px;
padding:9px 13px
}

#soundBtn{
position:fixed;
right:12px;
top:52px;
z-index:10;
border:0;
border-radius:12px;
padding:9px 12px;
font-size:18px
}

.control{
position:fixed;
bottom:22px;
width:78px;
height:78px;
border-radius:50%;
border:4px solid white;
background:#176fd0cc;
color:white;
font-size:35px;
z-index:10
}

#left{left:22px}
#right{right:22px}

#cheer{
position:fixed;
left:50%;
top:22%;
transform:translate(-50%,-50%);
width:min(240px,52vw);
padding:7px 10px;
background:#ffe44f;
border:3px solid white;
border-radius:14px;
font-size:clamp(14px,3vw,20px);
font-weight:900;
color:#6a4500;
text-align:center;
z-index:30;
display:none;
box-shadow:0 6px 15px #0004
}

#cheer small{
display:block;
font-size:11px;
margin-top:2px
}
</style>
</head>

<body>

<section id="home" class="screen show">
<div class="logo">🏁 LIAM CAR GAMES 🏁</div>
<div class="subtitle">Drive • Collect • Have Fun!</div>
<div id="driverIcon">🧒</div>

<button class="big play" onclick="startGame()">▶ PLAY</button>
<button class="big garageBtn" onclick="showScreen('garage')">🚗 MY GARAGE</button>
<button class="big driverBtn" onclick="showScreen('driver')">🙂 MY DRIVER</button>
</section>

<section id="garage" class="screen">
<button class="back" onclick="showScreen('home')">←</button>

<div class="panel">
<h2>Choose Your Car</h2>

<div class="carChoice sel" data-car="🏎️" onclick="pickCar(this)">🏎️<span>SPORT</span></div>
<div
