<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Liam Car Games</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#title{position:fixed;top:10px;width:100%;text-align:center;color:#ffd600;font-size:22px;font-weight:bold;z-index:3}#hud{position:fixed;top:42px;left:14px;color:white;font-size:18px;font-weight:bold;z-index:3}#level{position:fixed;top:42px;right:14px;color:white;font-size:18px;font-weight:bold;z-index:3}.btn{position:fixed;bottom:22px;width:78px;height:78px;border-radius:50%;border:3px solid white;background:#555;color:white;font-size:36px;z-index:4}#left{left:22px}#right{right:22px}#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:16px;padding:17px 28px;background:#ffd600;font-size:22px;font-weight:bold;z-index:5}</style></head><body><div id="title">LIAM CAR GAMES</div><div id="hud">Coins: <span id="coins">0</span></div><div id="level">Level 1</div><canvas id="game"></canvas><button id="left" class="btn">&#9664;</button><button id="right" class="btn">&#9654;</button><button id="start">START RACE</button><script>
var c=document.getElementById("game"),g=c.getContext("2d"),W,H,playing=false,move=0,coins=0,level=1,tick=0,traffic=[],money=[],car={x:0,y:0,w:44,h:76};
function size(){W=c.width=innerWidth;H=c.height=innerHeight;car.y=H-130;if(!playing)car.x=W/2-22}addEventListener("resize",size);size();
function road(){var rw=Math.min(W*.72,560);return{x:(W-rw)/2,w:rw}}
function dc(x,y,col){
g.save();g.translate(x,y);

// soft shadow
g.fillStyle="rgba(0,0,0,.35)";
g.beginPath();g.ellipse(22,67,27,10,0,0,Math.PI*2);g.fill();

// tires
g.fillStyle="#111";
g.fillRect(-5,16,8,20);g.fillRect(41,16,8,20);
g.fillRect(-5,48,8,20);g.fillRect(41,48,8,20);

// main 3D body gradient
var bodyGrad=g.createLinearGradient(0,0,44,0);
bodyGrad.addColorStop(0,"#7a0f0f");
bodyGrad.addColorStop(.18,col);
bodyGrad.addColorStop(.52,"#ff6b6b");
bodyGrad.addColorStop(.82,col);
bodyGrad.addColorStop(1,"#6e0d0d");
g.fillStyle=bodyGrad;
g.beginPath();
g.moveTo(7,4);
g.quadraticCurveTo(22,-2,37,4);
g.lineTo(44,18);
g.lineTo(42,61);
g.quadraticCurveTo(22,78,2,61);
g.lineTo(0,18);
g.closePath();
g.fill();

// hood and roof depth
var hood=g.createLinearGradient(0,6,0,32);
hood.addColorStop(0,"rgba(255,255,255,.55)");
hood.addColorStop(.3,"rgba(255,255,255,.12)");
hood.addColorStop(1,"rgba(0,0,0,.18)");
g.fillStyle=hood;
g.beginPath();
g.moveTo(8,7);g.lineTo(36,7);g.lineTo(39,21);g.lineTo(5,21);g.closePath();g.fill();

var roof=g.createLinearGradient(0,22,0,54);
roof.addColorStop(0,"#d7f2ff");
roof.addColorStop(.5,"#84c9ec");
roof.addColorStop(1,"#3f88b5");
g.fillStyle=roof;
g.beginPath();
g.moveTo(9,23);g.lineTo(35,23);g.lineTo(38,47);g.lineTo(6,47);g.closePath();g.fill();

// windshield reflection
g.fillStyle="rgba(255,255,255,.45)";
g.beginPath();g.moveTo(11,25);g.lineTo(21,25);g.lineTo(17,44);g.lineTo(8,44);g.closePath();g.fill();

// center body ridge
g.fillStyle="rgba(255,255,255,.18)";
g.fillRect(19,5,4,55);

// bumpers
g.fillStyle="#222";g.fillRect(7,2,30,5);g.fillRect(7,66,30,5);
g.fillStyle="#d8d8d8";g.fillRect(10,3,24,2);g.fillRect(10,67,24,2);

// headlights / tail lights
g.fillStyle="#fff7b0";g.fillRect(5,8,8,5);g.fillRect(31,8,8,5);
g.fillStyle="#ff3b30";g.fillRect(5,60,8,5);g.fillRect(31,60,8,5);

// side highlights
g.fillStyle="rgba(255,255,255,.35)";
g.fillRect(3,18,3,35);
g.fillStyle="rgba(0,0,0,.22)";
g.fillRect(38,18,3,35);

g.restore()
}
function draw(){var r=road();g.fillStyle="#2e9b3f";g.fillRect(0,0,W,H);
var sy=(tick*.45)%150;
for(var q=-1;q<7;q++){
 var yy=q*150+sy;
 g.fillStyle="#6d4c41";g.fillRect(18,yy+28,8,30);g.fillRect(W-26,yy+28,8,30);
 g.fillStyle="#1b5e20";g.beginPath();g.arc(22,yy+20,20,0,7);g.fill();g.beginPath();g.arc(W-22,yy+20,20,0,7);g.fill();
 if(q%2===0){
g.fillStyle="#fff";g.fillRect(52,yy+65,24,15);g.fillStyle="#222";g.fillRect(57,yy+78,5,7);g.fillRect(68,yy+78,5,7);g.fillStyle="#111";g.fillRect(72,yy+67,7,6);
g.fillStyle="#f5d7a1";g.fillRect(W-105,yy+72,44,28);g.fillStyle="#b5651d";g.beginPath();g.moveTo(W-110,yy+72);g.lineTo(W-83,yy+52);g.lineTo(W-56,yy+72);g.fill();g.fillStyle="#7ec8ff";g.fillRect(W-96,yy+80,10,10);g.fillRect(W-78,yy+80,10,10);
}else{
g.fillStyle="#8d6e63";g.beginPath();g.arc(65,yy+80,12,0,Math.PI*2);g.fill();
g.fillStyle="#fff";g.fillRect(W-90,yy+72,28,17);g.fillStyle="#111";g.fillRect(W-84,yy+86,5,8);g.fillRect(W-69,yy+86,5,8);g.fillStyle="#111";g.fillRect(W-65,yy+74,9,7);
}
}
g.fillStyle="#777";g.fillRect(r.x-12,0,12,H);g.fillRect(r.x+r.w,0,12,H);g.fillStyle="#3a3a3a";g.fillRect(r.x,0,r.w,H);g.fillStyle="white";g.fillRect(r.x,0,5,H);g.fillRect(r.x+r.w-5,0,5,H);for(var y=tick%70-70;y<H;y+=70)g.fillRect(W/2-3,y,6,35);for(var i=0;i<money.length;i++){var m=money[i];g.beginPath();g.arc(m.x,m.y,18,0,Math.PI*2);g.fillStyle="#ffd700";g.fill();g.lineWidth=4;g.strokeStyle="#ff9800";g.stroke();g.beginPath();g.arc(m.x-6,m.y-6,5,0,Math.PI*2);g.fillStyle="#fff59d";g.fill();g.fillStyle="#7a4b00";g.font="bold 18px Arial";g.textAlign="center";g.textBaseline="middle";g.fillText("$",m.x,m.y+1)}for(i=0;i<traffic.length;i++)dc(traffic[i].x,traffic[i].y,"#e53935");dc(car.x,car.y,coins>=20?"#ffd600":coins>=10?"#2196f3":"#e53935")}
function hit(o){return car.x<o.x+44&&car.x+44>o.x&&car.y<o.y+76&&car.y+76>o.y}
function over(){playing=false;move=0;var s=document.getElementById("start");s.style.display="block";s.textContent="TRY AGAIN"}
function update(){if(!playing)return;var r=road(),sp=2.8+level*.18;tick+=sp;car.x+=move;if(car.x<r.x+8)car.x=r.x+8;if(car.x>r.x+r.w-52)car.x=r.x+r.w-52;if(Math.random()<.018+.002*level)traffic.push({x:r.x+18+Math.random()*(r.w-80),y:-90});if(Math.random()<.014)money.push({x:r.x+28+Math.random()*(r.w-56),y:-25});for(var i=traffic.length-1;i>=0;i--){traffic[i].y+=sp;if(hit(traffic[i])){over();return}if(traffic[i].y>H+100)traffic.splice(i,1)}for(i=money.length-1;i>=0;i--){var m=money[i];m.y+=sp;if(car.x<m.x+20&&car.x+44>m.x-20&&car.y<m.y+20&&car.y+76>m.y-20){coins++;money.splice(i,1);document.getElementById("coins").textContent=coins;level=1+Math.floor(coins/8);document.getElementById("level").textContent="Level "+level}else if(m.y>H+30)money.splice(i,1)}}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
var L=document.getElementById("left"),R=document.getElementById("right");function stop(){move=0}L.ontouchstart=function(){move=-4.5};R.ontouchstart=function(){move=4.5};L.ontouchend=stop;R.ontouchend=stop;L.onmousedown=function(){move=-4.5};R.onmousedown=function(){move=4.5};L.onmouseup=stop;R.onmouseup=stop;
document.getElementById("start").onclick=function(){traffic=[];money=[];coins=0;level=1;document.getElementById("coins").textContent="0";document.getElementById("level").textContent="Level 1";car.x=W/2-22;playing=true;this.style.display="none"};
</script></body></html>
